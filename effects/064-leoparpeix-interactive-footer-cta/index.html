  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f7f7; }
    .effect-crop { position: fixed; inset: 0; overflow: hidden; background: #f7f7f7; }
    .effect-frame { width: 100%; height: 100%; border: 0; display: block; background: #f7f7f7; opacity: 0; transition: opacity .45s ease; }
    .effect-cover { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; object-position: center; pointer-events: none; transition: opacity .45s ease; }
    .effect-crop.is-ready .effect-frame { opacity: 1; }
    .effect-crop.is-ready .effect-cover { opacity: 0; }
  </style>

<body>
  <main class="effect-crop" id="effectCrop">
    <img class="effect-cover" src="preview.png" alt="" aria-hidden="true">
    <iframe
      class="effect-frame"
      id="effectFrame"
      title="Interactive footer call to action"
      src="assets/site/index.html?skipLoader=1"
      allow="autoplay; fullscreen"
    ></iframe>
  </main>

  <script>
    (function () {
      var crop = document.getElementById('effectCrop');
      var frame = document.getElementById('effectFrame');
      var framingTimer = null;
      var didPrimeTargetState = false;
      var revealTimer = null;
      var isolated = false;
      var scrollLockTimer = null;

      function prepareFooter() {
        var doc;
        var win;
        try {
          doc = frame.contentDocument;
          win = frame.contentWindow;
        } catch (error) {
          return false;
        }

        if (!doc || !win) return false;
        var footer = doc.querySelector('.footerBlock');
        var interactiveBee = doc.querySelector('.beeBlock.isFooter');
        if (!footer || !interactiveBee) return false;

        if (!isolated) {
          /* The original footer's title reveal is driven by its final scroll
             position. Preserve that runtime, but make the position immutable
             so no earlier portfolio content can ever enter the viewport. */
          var blockScroll = function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            win.scrollTo(0, doc.documentElement.scrollHeight - win.innerHeight);
          };
          win.addEventListener('wheel', blockScroll, { passive: false, capture: true });
          win.addEventListener('touchmove', blockScroll, { passive: false, capture: true });
          win.addEventListener('keydown', function (event) {
            if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].indexOf(event.key) !== -1) {
              blockScroll(event);
            }
          }, true);
          clearInterval(scrollLockTimer);
          scrollLockTimer = setInterval(function () {
            var bottom = doc.documentElement.scrollHeight - win.innerHeight;
            if (Math.abs(win.scrollY - bottom) > 1) win.scrollTo(0, bottom);
          }, 16);
          isolated = true;
        }

        /* The requested Effect is the footer CTA only. Keep the original app
           and WebGL runtime intact, but remove global navigation/chrome. */
        var navbar = doc.querySelector('.navbarBlock');
        if (navbar) navbar.style.display = 'none';
        var cursor = doc.querySelector('.cursorIndication');
        if (cursor) cursor.style.visibility = 'hidden';

        win.scrollTo(0, doc.documentElement.scrollHeight - win.innerHeight);

        /* Prime the screenshot's second headline state once. Further clicks
           remain handled by the source site's original interaction. */
        if (!didPrimeTargetState) {
          interactiveBee.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: win,
            clientX: win.innerWidth / 2,
            clientY: win.innerHeight / 2
          }));
          didPrimeTargetState = true;
        }

        return true;
      }

      frame.addEventListener('load', function () {
        var attempts = 0;
        clearInterval(framingTimer);
        framingTimer = setInterval(function () {
          var found = prepareFooter();
          attempts += 1;
          if (found && !revealTimer) {
            revealTimer = setTimeout(function () {
              prepareFooter();
              requestAnimationFrame(function () {
                requestAnimationFrame(function () { crop.classList.add('is-ready'); });
              });
            }, 5000);
          }
          if ((found && attempts >= 36) || attempts >= 120) {
            clearInterval(framingTimer);
          }
        }, 250);
      });
    })();
  </script>
