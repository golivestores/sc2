<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vectr · Footer Nav Hover</title>
<style>
@font-face{
  font-family:"Roboto Var";
  src:url("lib/roboto.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}
:root{
  --color-bg:#fcfcfc; --color-dark:#050419; --color-text-light:#fcfcfc;
  --color-border-dark:#373647;
  --text-xl:36px;
  --tracking-tight:-.96px; --tracking-tighter:-1.44px;
  --leading-snug:1.2;
  --space-lg:24px; --space-2xl:48px;
  --ease-default:cubic-bezier(.25,1,.5,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--color-dark)}
body{
  font-family:"Roboto Var","Roboto","Helvetica Neue",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  -webkit-font-smoothing:antialiased;
}

/* ============ FOOTER NAV (1:1 from vectrfl.com) ============ */
.footer-nav{
  display:flex;width:100%;height:200px;
  border-top:1px solid var(--color-border-dark);
  border-bottom:1px solid var(--color-border-dark);
}
.footer-nav-btn{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-2xl);height:100%;text-decoration:none;
  border-right:1px solid var(--color-border-dark);position:relative;overflow:hidden;
}
.footer-nav-btn:last-child{border-right:none}
.footer-nav-btn .footer-nav-btn__bg{
  position:absolute;inset:0;z-index:0;background-color:var(--color-bg);
  transform:scaleX(0);transform-origin:left center;
  transition:transform .8s var(--ease-default);
}
.footer-nav-btn .footer-nav-btn__label{
  position:relative;z-index:1;font-weight:500;font-size:var(--text-xl);
  line-height:var(--leading-snug);letter-spacing:var(--tracking-tighter);
  color:var(--color-text-light);
  transition:transform .8s var(--ease-default),color .8s var(--ease-default);
}
.footer-nav-btn .footer-nav-btn__arrows{
  position:relative;z-index:1;width:23px;height:32px;overflow:hidden;
}
.footer-nav-btn .footer-nav-btn__arrow{
  position:absolute;top:0;width:23px;height:32px;
  transition:transform .8s var(--ease-default);
}
.footer-nav-btn .footer-nav-btn__arrow--current{left:0}
.footer-nav-btn .footer-nav-btn__arrow--next{left:-100%}

/* hover (pointer:fine) + .is-hovered demo class share the same end state */
@media all and (pointer:fine){
  .footer-nav-btn:hover .footer-nav-btn__bg{transform:scaleX(1)}
  .footer-nav-btn:hover .footer-nav-btn__label{color:var(--color-dark);transform:translate(10px)}
  .footer-nav-btn:hover .footer-nav-btn__arrow--current{transform:translate(200%)}
  .footer-nav-btn:hover .footer-nav-btn__arrow--next{transform:translate(100%)}
}
.footer-nav-btn.is-hovered .footer-nav-btn__bg{transform:scaleX(1)}
.footer-nav-btn.is-hovered .footer-nav-btn__label{color:var(--color-dark);transform:translate(10px)}
.footer-nav-btn.is-hovered .footer-nav-btn__arrow--current{transform:translate(200%)}
.footer-nav-btn.is-hovered .footer-nav-btn__arrow--next{transform:translate(100%)}

@media (max-width:1200px){
  .footer-nav{height:160px}
  .footer-nav-btn{padding:0 var(--space-lg)}
  .footer-nav-btn .footer-nav-btn__label{font-size:28px}
}
@media (max-width:820px){
  body{display:block}
  .footer-nav{flex-direction:column;height:auto}
  .footer-nav-btn{flex:none;height:72px;border-right:none;border-bottom:1px solid var(--color-border-dark);padding:0 var(--space-lg)}
  .footer-nav-btn:last-child{border-bottom:none}
  .footer-nav-btn .footer-nav-btn__label{font-size:20px;letter-spacing:var(--tracking-tight)}
  .footer-nav-btn .footer-nav-btn__arrows,.footer-nav-btn .footer-nav-btn__arrow{width:18px;height:26px}
}
</style>
</head>
<body>

<script>
// preview thumbnail: show one button in its hovered (filled) state since CSS :hover
// can't fire in a static screenshot.
(function(){
  const isPreview = new URLSearchParams(location.search).get('demo') === 'preview';
  if (isPreview) {
    const btns = document.querySelectorAll('.footer-nav-btn');
    (btns[1] || btns[0])?.classList.add('is-hovered');
  }
})();
</script>
