<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Louis Vuitton VIA · 3D 藏品拖拽旋转</title>
<style>
  :root { --ink:#241c12; --soft:#6b5f4d; --line:rgba(36,28,18,.22); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"Times New Roman", Georgia, serif; color:var(--ink);
    background:#ece9e2;            /* clean flat neutral — model only, no scene background */
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; cursor:default; }

  #loader {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; z-index:30; transition:opacity .8s ease;
    background:#ece9e2; letter-spacing:.35em;
  }
  #loader.hidden { opacity:0; pointer-events:none; }
  #loader .brand { font-size:clamp(22px,4vw,40px); letter-spacing:.18em; text-transform:uppercase; }
  #loader .bar { width:150px; height:1px; background:rgba(36,28,18,.2); position:relative; overflow:hidden; }
  #loader .bar i { position:absolute; inset:0; width:0%; background:var(--ink); transition:width .2s; }
  #loader .pct { font-size:11px; letter-spacing:.45em; opacity:.6; font-family:Arial, sans-serif; }

  .label { position:fixed; top:6%; left:0; right:0; text-align:center; z-index:10; pointer-events:none; }
  .label .maison { font-size:clamp(16px,2.6vw,26px); letter-spacing:.28em; text-transform:uppercase; }
  .label .model { margin-top:8px; font-size:11px; letter-spacing:.5em; text-transform:uppercase;
    font-family:Arial, sans-serif; color:var(--soft); }

  .hint { position:fixed; bottom:7%; left:0; right:0; text-align:center; z-index:10;
    font-family:Arial, sans-serif; font-size:11px; letter-spacing:.42em; text-transform:uppercase;
    color:rgba(36,28,18,.5); pointer-events:none; animation:breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:.75} }

  .switch { position:fixed; bottom:6.5%; left:50%; transform:translateX(-50%); display:flex; gap:9px; z-index:12; }
  .switch button {
    background:transparent; border:1px solid var(--line); color:var(--ink);
    font-family:Arial, sans-serif; font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    padding:9px 15px; border-radius:30px; cursor:pointer; transition:.35s;
  }
  .switch button.active { background:var(--ink); border-color:var(--ink); color:#efe9df; }
  .switch button:hover { border-color:var(--ink); }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="label" data-demo-only>
    <div class="maison">Louis&nbsp;Vuitton</div>
    <div class="model" id="modelName">VIA Treasure Trunk</div>
  </div>

  <div class="switch" data-demo-only>
    <button id="btnTrunk" class="active">Trunk</button>
    <button id="btnSpeedy">Speedy</button>
  </div>

  <div class="hint" data-demo-only>向下滚动旋转 · SCROLL&nbsp;TO&nbsp;ROTATE</div>

  <div id="loader">
    <div class="brand">Louis Vuitton</div>
    <div class="bar"><i></i></div>
    <div class="pct">0%</div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/RoomEnvironment.js"></script>
  <script src="lib/DRACOLoader.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  <script>
  (function () {
    "use strict";
    const IS_PREVIEW = new URLSearchParams(location.search).get('demo') === 'preview';

    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;   // leather/canvas reads richer than Linear here
    renderer.toneMappingExposure = 1.05;
    renderer.physicallyCorrectLights = true;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(renderer), 0.04).texture;

    const key = new THREE.DirectionalLight(0xfff4e2, 2.4); key.position.set(2.5, 3, 4); scene.add(key);
    const fill = new THREE.DirectionalLight(0xdfe6ff, 0.9); fill.position.set(-3, 1, 2); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffe7c0, 1.2); rim.position.set(-2, 2, -3); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    // rotation rig: undulationWrapper -> dragWrapper -> model
    const undulationWrapper = new THREE.Group();
    const dragWrapper = new THREE.Group();
    undulationWrapper.add(dragWrapper);
    scene.add(undulationWrapper);

    // exact damp glue from the Cartier W&W experience: lerp(cur, tgt, 1 - exp(-speed*dt))
    const lerp = (a, b, t) => (1 - t) * a + t * b;
    const damp = (cur, tgt, speed, dt) => lerp(cur, tgt, 1 - Math.exp(-speed * dt));
    // wheel-scroll drives the spin — SAME interaction as the original LV experience:
    // a continuous Y-axis rotation that the scroll wheel feeds into (smooth-damped follow).
    const CFG = { scrollK: 0.0026, idleSpin: 0.10, follow: 3.6, tiltSpeed: 1.5 };

    const tiltRot = { x: 0, y: 0 }, ndc = { x: 0, y: 0 };
    let undTime = 0, spinY = 0, targetY = 0;

    window.addEventListener('pointermove', e => {
      ndc.x = (e.clientX/window.innerWidth)*2 - 1; ndc.y = -((e.clientY/window.innerHeight)*2 - 1);
    });
    // scroll down → rotate forward, scroll up → rotate back
    window.addEventListener('wheel', e => { targetY += e.deltaY * CFG.scrollK; }, { passive: true });

    const draco = new THREE.DRACOLoader().setDecoderPath('lib/').setDecoderConfig({ type:'js' });
    const gltf = new THREE.GLTFLoader().setDRACOLoader(draco);

    const MODELS = {
      trunk:   { file:'assets/models/trunk.glb',  name:'VIA Treasure Trunk' },
      speedy:  { file:'assets/models/speedy.glb', name:'Speedy' },
    };
    let current = null;
    const loaderEl = document.getElementById('loader');
    const barEl = loaderEl.querySelector('.bar i');
    const pctEl = loaderEl.querySelector('.pct');

    function stripBackdrops(root){
      // some glb are full "scenes" with a giant background/sky plane that would blow up the
      // bounding box (montgolfière, paris) — remove backdrop-ish meshes so framing sees the object
      const kill = [];
      root.traverse(o => {
        const n = ((o.name||'') + ' ' + (o.material && o.material.name || '')).toLowerCase();
        if (/background|backdrop|\bsky\b|\bground\b|\bfloor\b/.test(n)) kill.push(o);
      });
      kill.forEach(o => o.parent && o.parent.remove(o));
    }
    function frameModel(root){
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      root.position.sub(center);
      const r = sphere.radius || 1;
      const s = 1.5 / r;                 // fit the bounding SPHERE (rotation-invariant) so it never clips while spinning
      root.scale.setScalar(s);
      root.userData._baseScale = s;
      root.rotation.set(-0.12, 0.0, 0);
    }

    function loadModel(key, firstLoad){
      const def = MODELS[key];
      if (firstLoad) loaderEl.classList.remove('hidden');
      gltf.load(def.file, g => {
        if (current) { dragWrapper.remove(current); current.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); }
        current = g.scene;
        stripBackdrops(current);
        frameModel(current);
        dragWrapper.add(current);
        spinY = targetY = 0;
        document.getElementById('modelName').textContent = def.name;
        setTimeout(()=>loaderEl.classList.add('hidden'), 150);
      }, ev => {
        if (ev.total) { const p = Math.round(ev.loaded/ev.total*100); barEl.style.width = p+'%'; pctEl.textContent = p+'%'; }
      }, err => { console.error('glb load error', err); pctEl.textContent = 'load error'; });
    }

    const btnT = document.getElementById('btnTrunk'), btnS = document.getElementById('btnSpeedy');
    function pick(btn, key){ if (btn.classList.contains('active')) return;
      [btnT,btnS].forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadModel(key); }
    btnT.addEventListener('click', ()=>pick(btnT,'trunk'));
    btnS.addEventListener('click', ()=>pick(btnS,'speedy'));

    loadModel('trunk', true);

    let last = performance.now();
    function tick(now){
      const dt = Math.min((now - last)/1000, 0.05); last = now;
      // gentle continuous Y spin (the original trunk is always rotating); preview spins faster
      targetY += (IS_PREVIEW ? 0.6 : CFG.idleSpin) * dt;
      // smooth follow toward the scroll-accumulated target angle (the "smooth scroll" feel)
      spinY = damp(spinY, targetY, CFG.follow, dt);
      // subtle cursor parallax tilt (like the original's mouse influence)
      const tgtTiltY = 0.06 * Math.PI * ndc.x, tgtTiltX = -0.04 * Math.PI * ndc.y;
      tiltRot.y = damp(tiltRot.y, tgtTiltY, CFG.tiltSpeed, dt);
      tiltRot.x = damp(tiltRot.x, tgtTiltX, CFG.tiltSpeed, dt);
      dragWrapper.rotation.y = spinY + tiltRot.y;
      dragWrapper.rotation.x = tiltRot.x;
      // idle undulation
      undTime += dt; const o = undTime;
      undulationWrapper.rotation.x = Math.sin(o*0.3)*0.003 + Math.sin(o*0.7)*0.002;
      undulationWrapper.rotation.y = Math.cos(o*0.2)*0.003 + Math.cos(o*0.5)*0.002;
      undulationWrapper.rotation.z = Math.sin(o*0.15)*0.0005;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    if (IS_PREVIEW) document.querySelectorAll('[data-demo-only]').forEach(el => el.style.display = 'none');
  })();
  </script>
