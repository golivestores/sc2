<script>
(function () {
  "use strict";

  const frame = document.getElementById("mirror");
  const scrollRange = document.getElementById("scroll-range");
  const previewMode = new URLSearchParams(location.search).get("demo") === "preview";
  let innerWindow = null;
  let innerDocument = null;
  let sectionTop = 0;
  let sectionRange = 1;
  let ready = false;
  let raf = 0;
  let previewStart = performance.now();
  let locateTimer = 0;

  function smoothstep(value) {
    value = Math.max(0, Math.min(1, value));
    return value * value * (3 - 2 * value);
  }

  function previewProgress(now) {
    const duration = 8.4;
    const t = ((now - previewStart) / 1000) % duration;
    const linear = t < duration / 2 ? t / (duration / 2) : 1 - (t - duration / 2) / (duration / 2);
    return smoothstep(linear);
  }

  function outerProgress(now) {
    if (previewMode) return previewProgress(now);
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    return Math.max(0, Math.min(1, scrollY / max));
  }

  function wheelPixels(event, win) {
    if (event.deltaMode === 1) return event.deltaY * 16;
    if (event.deltaMode === 2) return event.deltaY * win.innerHeight;
    return event.deltaY;
  }

  function installInnerControls(win, doc) {
    if (doc.getElementById("sc2-syenergy-frame-style")) return;
    const style = doc.createElement("style");
    style.id = "sc2-syenergy-frame-style";
    style.textContent = [
      "html,body{scrollbar-width:none!important}",
      "html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}",
      ".default-menu{transform:translateY(0)!important;z-index:2147483000!important;isolation:isolate}",
      "#sc2-overlay{display:none!important}"
    ].join("");
    doc.head.appendChild(style);

    win.addEventListener("wheel", function (event) {
      if (previewMode) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.scrollBy(0, wheelPixels(event, win));
      requestUpdate();
    }, { passive: false, capture: true });

    win.addEventListener("keydown", function (event) {
      if (previewMode || event.defaultPrevented) return;
      const movement = {
        ArrowDown: 52,
        ArrowUp: -52,
        PageDown: innerHeight * .85,
        PageUp: -innerHeight * .85,
        " ": event.shiftKey ? -innerHeight * .85 : innerHeight * .85
      }[event.key];
      if (movement == null) return;
      event.preventDefault();
      window.scrollBy(0, movement);
      requestUpdate();
    });
  }

  function measure() {
    if (!innerDocument || !innerWindow) return false;
    const section = innerDocument.querySelector(".syenergy");
    if (!section || section.offsetHeight < innerWindow.innerHeight * 2) return false;
    sectionTop = section.getBoundingClientRect().top + innerWindow.scrollY;
    sectionRange = Math.max(1, section.offsetHeight - innerWindow.innerHeight);
    scrollRange.style.height = (window.innerHeight + sectionRange) + "px";
    installInnerControls(innerWindow, innerDocument);
    ready = true;
    document.body.classList.add("is-ready");
    return true;
  }

  function locateTarget() {
    clearTimeout(locateTimer);
    if (measure()) {
      requestUpdate();
      return;
    }
    locateTimer = setTimeout(locateTarget, 180);
  }

  function sync(now) {
    raf = 0;
    if (!ready || !innerWindow) {
      if (previewMode) requestUpdate();
      return;
    }
    innerWindow.scrollTo(0, sectionTop + sectionRange * outerProgress(now || performance.now()));
    if (previewMode) requestUpdate();
  }

  function requestUpdate() {
    if (raf) return;
    raf = requestAnimationFrame(sync);
  }

  frame.addEventListener("load", function () {
    try {
      innerWindow = frame.contentWindow;
      innerDocument = frame.contentDocument;
      locateTarget();
    } catch (error) {
      document.body.classList.add("is-ready");
    }
  });

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", function () {
    ready = false;
    clearTimeout(locateTimer);
    locateTimer = setTimeout(locateTarget, 160);
  });
})();
</script>
