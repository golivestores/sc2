<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartier 腕表 3D 拖拽旋转</title>
<style>
  :root { --cream:#e9e1d2; --gold:#c8a45c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0b09; }
  body {
    font-family:"Times New Roman", Georgia, serif;
    color:var(--cream);
    /* warm Cartier-ish vignette behind the watch */
    background:
      radial-gradient(120% 90% at 50% 38%, #2a2118 0%, #19140e 45%, #0b0907 100%);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.grabbing { cursor:grabbing; }

  /* soft floor glow under the watch */
  #floor {
    position:fixed; left:50%; bottom:14%; transform:translateX(-50%);
    width:46vmin; height:9vmin; pointer-events:none;
    background:radial-gradient(50% 100% at 50% 0%, rgba(200,164,92,.22), rgba(200,164,92,0) 70%);
    filter:blur(6px); opacity:.8;
  }

  /* loader */
  #loader {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:30;
    background:radial-gradient(120% 90% at 50% 40%, #241c14, #0b0907);
    transition:opacity .8s ease; letter-spacing:.35em;
  }
  #loader.hidden { opacity:0; pointer-events:none; }
  #loader .brand { font-size:clamp(26px,5vw,46px); letter-spacing:.06em; color:var(--cream); }
  #loader .bar { width:160px; height:1px; background:rgba(233,225,210,.25); position:relative; overflow:hidden; }
  #loader .bar i { position:absolute; inset:0; width:0%; background:var(--gold); transition:width .2s; }
  #loader .pct { font-size:12px; letter-spacing:.4em; opacity:.7; font-family:Arial, sans-serif; }

  /* header label */
  .label {
    position:fixed; top:6%; left:0; right:0; text-align:center; z-index:10;
    pointer-events:none;
  }
  .label .maison { font-size:clamp(22px,4.2vw,40px); letter-spacing:.05em; }
  .label .model { margin-top:6px; font-size:11px; letter-spacing:.5em;
    text-transform:uppercase; font-family:Arial, sans-serif; color:var(--gold); opacity:.85; }

  /* drag hint (demo scaffolding) */
  .hint {
    position:fixed; bottom:7%; left:0; right:0; text-align:center; z-index:10;
    font-family:Arial, sans-serif; font-size:11px; letter-spacing:.42em;
    text-transform:uppercase; color:rgba(233,225,210,.6); pointer-events:none;
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:.8} }

  /* model switch */
  .switch {
    position:fixed; bottom:6.5%; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:12;
  }
  .switch button {
    background:transparent; border:1px solid rgba(233,225,210,.28); color:var(--cream);
    font-family:Arial, sans-serif; font-size:10px; letter-spacing:.25em; text-transform:uppercase;
    padding:9px 16px; border-radius:30px; cursor:pointer; transition:.35s;
  }
  .switch button.active { background:var(--gold); border-color:var(--gold); color:#1a140c; }
  .switch button:hover { border-color:var(--gold); }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="floor"></div>

  <div class="label" data-demo-only>
    <div class="maison">Cartier</div>
    <div class="model" id="modelName">Santos de Cartier</div>
  </div>

  <div class="switch" data-demo-only>
    <button id="btnSantos" class="active">Santos</button>
    <button id="btnBaignoire">Baignoire</button>
  </div>

  <div class="hint" data-demo-only>拖拽旋转 · 松手惯性 · DRAG&nbsp;TO&nbsp;SPIN</div>

  <div id="loader">
    <div class="brand">Cartier</div>
    <div class="bar"><i></i></div>
    <div class="pct">0%</div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/RoomEnvironment.js"></script>
  <script src="lib/DRACOLoader.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  <script>
  (function () {
    "use strict";
    const IS_PREVIEW = new URLSearchParams(location.search).get('demo') === 'preview';

    // ---------- renderer / scene / camera (faithful to original: fov50, LinearToneMapping, sRGB) ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.LinearToneMapping;     // original = LinearToneMapping
    renderer.toneMappingExposure = 1.0;
    renderer.physicallyCorrectLights = true;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000); // fov 50
    camera.position.set(0, 0, 6);

    // procedural studio env (gold/metal reflections) — stand-in for the site's octahedral EXR
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new THREE.RoomEnvironment(renderer), 0.04);
    scene.environment = envRT.texture;

    // a couple of soft key lights so the dial/decals read warm
    const key = new THREE.DirectionalLight(0xfff2dc, 2.2); key.position.set(2, 3, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xc8a45c, 1.4); rim.position.set(-3, 1, -2); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.18));

    // ---------- rotation rig (faithful hierarchy): undulationWrapper -> dragWrapper -> model ----------
    const undulationWrapper = new THREE.Group();
    const dragWrapper = new THREE.Group();
    undulationWrapper.add(dragWrapper);
    scene.add(undulationWrapper);

    // ---------- exact damp glue from app.js: lerp(cur, tgt, 1 - exp(-speed*dt)) ----------
    const lerp = (a, b, t) => (1 - t) * a + t * b;
    const damp = (cur, tgt, speed, dt) => lerp(cur, tgt, 1 - Math.exp(-speed * dt));

    // config mirrors original rotation:{dragSpeed:.008, latency:2}; tilt damp speed 1.5; fov-velocity damp 1
    const CFG = { dragSpeed: 0.008, dragLatency: 2, tiltSpeed: 1.5, fovSpeed: 1 };
    const TAU = Math.PI * 2;

    const target = { x: 0, y: 0 };       // accumulated drag target
    const dragRot = { x: 0, y: 0 };      // damped follower (the inertia/lag feel)
    const tiltRot = { x: 0, y: 0 };      // cursor-parallax tilt (damped)
    const ndc = { x: 0, y: 0 };          // pointer in -1..1
    let tiltWeight = 1;                  // 1 when idle (tilt visible) -> 0 while dragging
    let undTime = 0;
    let fovOnVel = 0;

    // momentum for fling-release inertia (continues target after release, decays)
    let angVelY = 0, angVelX = 0;
    let dragging = false, lastX = 0, lastY = 0;

    // ---------- pointer input ----------
    const el = renderer.domElement;
    function setNdc(e){ ndc.x = (e.clientX/window.innerWidth)*2 - 1; ndc.y = -((e.clientY/window.innerHeight)*2 - 1); }
    el.addEventListener('pointerdown', e => {
      dragging = true; lastX = e.clientX; lastY = e.clientY; angVelY = angVelX = 0;
      el.classList.add('grabbing'); el.setPointerCapture(e.pointerId);
    });
    window.addEventListener('pointermove', e => {
      setNdc(e);
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      target.y += dx * CFG.dragSpeed;     // dragSpeed 0.008
      target.x += dy * CFG.dragSpeed;
      target.x = Math.max(-0.9, Math.min(0.9, target.x)); // clamp pitch so it never flips upside down
      angVelY = dx * CFG.dragSpeed;       // remember last velocity for fling
      angVelX = dy * CFG.dragSpeed;
    });
    function endDrag(e){
      if (!dragging) return; dragging = false; el.classList.remove('grabbing');
      // hand the last velocity to the target so it keeps spinning, then decays
    }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    // ---------- model loading ----------
    const draco = new THREE.DRACOLoader().setDecoderPath('lib/').setDecoderConfig({ type:'js' });
    const gltf = new THREE.GLTFLoader().setDRACOLoader(draco);

    const MODELS = {
      santos:    { file:'assets/models/santos.glb',    name:'Santos de Cartier' },
      baignoire: { file:'assets/models/baignoire.glb', name:'Baignoire' },
    };
    let current = null;          // current model root
    const loaderEl = document.getElementById('loader');
    const barEl = loaderEl.querySelector('.bar i');
    const pctEl = loaderEl.querySelector('.pct');

    function frameModel(root){
      // center at origin so rotation pivots on the watch center, then scale to a stable size
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      root.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const s = 3.4 / maxDim;
      root.scale.setScalar(s);
      root.userData._baseScale = s;          // for the fov-velocity scale kick
      // face the watch toward the camera, slight 3/4 tilt so it reads as 3D
      root.rotation.set(-0.15, 0.0, 0);
    }

    function loadModel(key, firstLoad){
      const def = MODELS[key];
      if (firstLoad) { loaderEl.classList.remove('hidden'); }
      gltf.load(def.file, g => {
        if (current) { dragWrapper.remove(current); current.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); }
        current = g.scene;
        frameModel(current);
        dragWrapper.add(current);
        // reset rotation state on swap
        target.x = target.y = dragRot.x = dragRot.y = 0;
        document.getElementById('modelName').textContent = def.name;
        // intro: settle-in spin (skipped semantics in preview where we keep spinning)
        target.y = IS_PREVIEW ? 0 : -0.6;
        hideLoader();
      }, ev => {
        if (ev.total) { const p = Math.round(ev.loaded/ev.total*100); barEl.style.width = p+'%'; pctEl.textContent = p+'%'; }
      }, err => { console.error('glb load error', err); pctEl.textContent = 'load error'; });
    }
    function hideLoader(){ setTimeout(()=>loaderEl.classList.add('hidden'), 150); }

    // model switch buttons
    const btnS = document.getElementById('btnSantos'), btnB = document.getElementById('btnBaignoire');
    btnS.addEventListener('click', ()=>{ if(btnS.classList.contains('active'))return; btnS.classList.add('active'); btnB.classList.remove('active'); loadModel('santos'); });
    btnB.addEventListener('click', ()=>{ if(btnB.classList.contains('active'))return; btnB.classList.add('active'); btnS.classList.remove('active'); loadModel('baignoire'); });

    loadModel('santos', true);

    // ---------- render loop ----------
    let last = performance.now();
    function tick(now){
      const dt = Math.min((now - last)/1000, 0.05); last = now;

      // preview: gentle continuous auto-spin so the gallery card isn't static
      if (IS_PREVIEW) target.y += dt * 0.5;

      // fling momentum after release: keep feeding target, decay velocity
      if (!dragging && (Math.abs(angVelY) > 1e-5 || Math.abs(angVelX) > 1e-5)) {
        target.y += angVelY; target.x += angVelX;
        target.x = Math.max(-0.9, Math.min(0.9, target.x));
        const decay = Math.exp(-3.0 * dt);   // spin-down
        angVelY *= decay; angVelX *= decay;
        if (Math.abs(angVelY) < 1e-5) angVelY = 0;
        if (Math.abs(angVelX) < 1e-5) angVelX = 0;
      }

      // wrap accumulated angle into ±2π (original does target%2π and drag%2π)
      target.y %= TAU; target.x %= TAU;

      // drag follower: exp-damp toward target at latency speed 2 -> the signature smooth catch-up
      dragRot.y = damp(dragRot.y, target.y, CFG.dragLatency, dt);
      dragRot.x = damp(dragRot.x, target.x, CFG.dragLatency, dt);

      // cursor-parallax tilt: ndc -> target tilt (yaw .1π*ndc.x, pitch -.05π*ndc.y), damp speed 1.5
      const tgtTiltY = 0.1 * Math.PI * ndc.x;
      const tgtTiltX = -0.05 * Math.PI * ndc.y;
      tiltRot.y = damp(tiltRot.y, tgtTiltY, CFG.tiltSpeed, dt);
      tiltRot.x = damp(tiltRot.x, tgtTiltX, CFG.tiltSpeed, dt);
      // tilt visible when idle, fades out while dragging (original weights tilt by 1-rotationEnableRatio)
      tiltWeight = damp(tiltWeight, dragging ? 0 : 1, 4, dt);

      // compose drag + parallax-tilt onto the drag wrapper
      dragWrapper.rotation.y = dragRot.y + tiltRot.y * tiltWeight;
      dragWrapper.rotation.x = dragRot.x + tiltRot.x * tiltWeight;

      // idle undulation (exact freqs/amps) — a tiny living wobble on the outer wrapper
      undTime += dt;
      const o = undTime;
      undulationWrapper.rotation.x = Math.sin(o*0.3)*0.003 + Math.sin(o*0.7)*0.002;
      undulationWrapper.rotation.y = Math.cos(o*0.2)*0.003 + Math.cos(o*0.5)*0.002;
      undulationWrapper.rotation.z = Math.sin(o*0.15)*0.0005;

      // fov-on-velocity kick (original: scale += .2*fovOnVelocity). subtle "breath" on fast spins.
      const spin = Math.abs(angVelY) + Math.abs(angVelX);
      fovOnVel = damp(fovOnVel, Math.min(spin*6, 1), CFG.fovSpeed, dt);
      if (current && current.userData._baseScale) {
        current.scale.setScalar(current.userData._baseScale * (1 + 0.06 * fovOnVel));
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ---------- resize ----------
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- preview mode: strip demo-only scaffolding ----------
    if (IS_PREVIEW) {
      document.querySelectorAll('[data-demo-only]').forEach(el => el.style.display = 'none');
    }
  })();
  </script>
