  * { box-sizing: border-box; }

  body {

  @media (max-width: 700px) {

  }

<iframe
  id="podium-mirror"

<script>
(function () {
  "use strict";
  const frame = document.getElementById("podium-mirror");
  const previewMode = new URLSearchParams(location.search).get("demo") === "preview";
  let frameReady = false;
  let innerScrollProxyInstalled = false;
  let raf = 0;
  let previewStart = performance.now();

  function maxSlice() {
    return Math.max(900, window.innerHeight * (window.innerWidth < 700 ? 1.15 : 1.2));
  }

  function getTargetScroll(now) {
    if (!previewMode) return Math.min(window.scrollY, maxSlice());
    const t = ((now - previewStart) / 1000) % 7.2;
    const phase = t < 3.6 ? t / 3.6 : 1 - (t - 3.6) / 3.6;
    const eased = phase * phase * (3 - 2 * phase);
    return eased * maxSlice();
  }

  function hideInnerChrome(doc) {
    if (doc.getElementById("sc2-effect-frame-style")) return;
    const style = doc.createElement("style");
    style.id = "sc2-effect-frame-style";
    style.textContent = [
      "html,body{scrollbar-width:none!important}",
      "html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}",
      "#sc2-overlay{display:none!important}"
    ].join("");
    doc.head.appendChild(style);
  }

  function wheelPixels(event, win) {
    if (event.deltaMode === 1) return event.deltaY * 16;
    if (event.deltaMode === 2) return event.deltaY * win.innerHeight;
    return event.deltaY;
  }

  function installInnerScrollProxy(win) {
    if (innerScrollProxyInstalled) return;
    innerScrollProxyInstalled = true;
    win.addEventListener("wheel", function (event) {
      if (previewMode) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.scrollBy(0, wheelPixels(event, win));
      requestUpdate();
    }, { passive: false, capture: true });
    win.addEventListener("keydown", function (event) {
      if (previewMode || event.defaultPrevented) return;
      const keys = {
        ArrowDown: 48,
        ArrowUp: -48,
        PageDown: window.innerHeight * 0.85,
        PageUp: -window.innerHeight * 0.85,
        " ": event.shiftKey ? -window.innerHeight * 0.85 : window.innerHeight * 0.85
      };
      if (!(event.key in keys)) return;
      event.preventDefault();
      window.scrollBy(0, keys[event.key]);
      requestUpdate();
    });
  }

  function sync(now) {
    raf = 0;
    if (!frameReady || !frame.contentWindow) {
      if (previewMode) requestUpdate();
      return;
    }
    try {
      const win = frame.contentWindow;
      hideInnerChrome(frame.contentDocument);
      installInnerScrollProxy(win);
      win.scrollTo(0, getTargetScroll(now || performance.now()));
    } catch (error) {
      // Same-origin is expected under the sc2 local server. If the page is
      // opened somewhere else, leave the original mirror visible instead.
    }
    if (previewMode) requestUpdate();
  }

  function requestUpdate() {
    if (raf) return;
    raf = requestAnimationFrame(sync);
  }

  frame.addEventListener("load", function () {
    frameReady = true;
    document.body.classList.add("is-loaded");
    requestUpdate();
    setTimeout(requestUpdate, 500);
    setTimeout(requestUpdate, 1500);
  });

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);
  requestUpdate();
})();
</script>
