  <title>Leoparpeix WebGL Bookshelf · sc2 effect</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #2a1c13; }
    .effect-stage { position: fixed; inset: 0; overflow: hidden; background: #2a1c13; }
    .effect-frame { width: 100%; height: 100%; border: 0; display: block; background: #2a1c13; }
    .effect-status {
      position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
      color: #f7f7f7; background: #2a1c13; font: 14px/1.4 Arial, sans-serif;
      transition: opacity .35s ease; pointer-events: none;
    }
    .effect-stage.is-ready .effect-status { opacity: 0; }
  </style>
</head>
<body>
  <main class="effect-stage" id="effectStage">
    <div class="effect-status">Loading WebGL bookshelf…</div>
    <iframe
      class="effect-frame"
      id="effectFrame"
      title="WebGL bookshelf scroll scene"
      src="assets/site/index.html?skipLoader=1"
      allow="autoplay; fullscreen"
    ></iframe>
  </main>

  <script>
    (function () {
      var stage = document.getElementById('effectStage');
      var frame = document.getElementById('effectFrame');
      var isolateTimer = null;
      var isolated = false;

      function isolateBookshelf() {
        var doc;
        var win;
        try {
          doc = frame.contentDocument;
          win = frame.contentWindow;
        } catch (error) {
          return false;
        }
        if (!doc || !win) return false;

        var section = doc.querySelector('.webglSectionBlock');
        if (!section) return false;
        var wrapper = section.parentElement;
        var page = section.closest('.page');
        var app = section.closest('.app');

        if (!isolated) {
          /* Delete every content section except the requested bookshelf. The
             global WebGL canvases remain because they carry the original
             fluid cursor, post-processing and scene renderer. */
          if (wrapper) {
            Array.from(wrapper.children).forEach(function (child) {
              if (child !== section) child.remove();
            });
          }
          if (page) {
            Array.from(page.children).forEach(function (child) {
              if (child !== wrapper) child.remove();
            });
          }

          doc.querySelectorAll('.navbarBlock, .navbarBlock__overlay, .cursorIndication, .videoPlayer').forEach(function (node) {
            node.remove();
          });

          [doc.documentElement, doc.body, app, page, wrapper].forEach(function (node) {
            if (!node) return;
            node.style.minHeight = '0';
            node.style.height = 'auto';
          });
          if (wrapper) {
            wrapper.style.transform = 'none';
            wrapper.style.position = 'relative';
          }
          section.style.margin = '0';
          isolated = true;
          win.dispatchEvent(new Event('resize'));
        }

        /* Keep the target at the top if the source smooth-scroll runtime
           restores an earlier portfolio position. User scrolling remains
           native inside this isolated 200vh module. */
        if (win.scrollY > section.offsetHeight) win.scrollTo(0, 0);
        stage.classList.add('is-ready');
        return true;
      }

      frame.addEventListener('load', function () {
        var attempts = 0;
        clearInterval(isolateTimer);
        isolateTimer = setInterval(function () {
          var found = isolateBookshelf();
          attempts += 1;
          if ((found && attempts >= 40) || attempts >= 140) {
            clearInterval(isolateTimer);
          }
        }, 250);
      });
    })();
  </script>
