  <section class="home-full-bleed-text-video">

      <canvas class="video-displacement-canvas"></canvas>
    </div>
  </section>

<script>
/* ON.energy "video-displacement" light-trail effect — self-contained.
   A full-screen WebGL quad samples the (hidden) trail video as a texture. Near the
   cursor it applies a flowing wave + chromatic-aberration displacement along the
   trail direction; elsewhere it draws the raw frame. Shaders/params are the originals.
   The render loop runs on its own requestAnimationFrame (the source site bound it to a
   framework raf hook). If WebGL can't init, the raw video is shown so trails still play. */
(function () {
  var VERT =
    "attribute vec2 a_position;attribute vec2 a_texCoord;varying vec2 v_texCoord;" +
    "void main(){gl_Position=vec4(a_position,0.0,1.0);v_texCoord=a_texCoord;}";
  var FRAG = [
    "precision mediump float;",
    "uniform sampler2D u_texture;uniform vec2 u_mouse;uniform float u_radius;",
    "uniform float u_strength;uniform float u_active;uniform float u_time;",
    "varying vec2 v_texCoord;",
    "void main(){",
    "  vec2 uv=v_texCoord;",
    "  float dist=distance(uv,u_mouse);",
    "  float influence=smoothstep(u_radius,0.0,dist)*u_active;",
    "  if(influence>0.001){",
    "    vec2 trailDirection=normalize(vec2(1.0,-1.0)+0.3*vec2(v_texCoord.y,v_texCoord.x));",
    "    float positionAlongTrail=dot(uv,trailDirection);",
    "    float wave=sin(positionAlongTrail*15.0-u_time*3.0);",
    "    vec2 flowOffset=trailDirection*wave*influence*u_strength*2.0;",
    "    float offset=influence*u_strength;",
    "    vec2 redOffset=trailDirection*offset*1.5+flowOffset;",
    "    vec2 blueOffset=-trailDirection*offset*1.5+flowOffset;",
    "    float r=texture2D(u_texture,uv+redOffset).r;",
    "    float g=texture2D(u_texture,uv+flowOffset).g;",
    "    float b=texture2D(u_texture,uv+blueOffset).b;",
    "    gl_FragColor=vec4(r,g,b,1.0);",
    "  }else{gl_FragColor=texture2D(u_texture,uv);}",
    "}"
  ].join("\n");
  var P = { radius: 0.25, strength: 0.015, smoothing: 0.1 };

  var section = document.querySelector(".home-full-bleed-text-video");
  var video = document.querySelector(".source-video");
  var canvas = document.querySelector(".video-displacement-canvas");

  function tryPlay() { try { video.muted = true; var p = video.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  tryPlay();
  video.addEventListener("canplay", tryPlay);
  video.addEventListener("loadeddata", tryPlay);

  var gl = null;
  try { gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl"); } catch (e) {}
  if (!gl) { return; } // CSS :not(.gl-ok) keeps the raw video visible

  function compile(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error("shader:", gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return;
  var prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error("link:", gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  var pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var pl = gl.getAttribLocation(prog, "a_position"); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
  var tb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 1, 1, 1, 0, 0, 1, 0]), gl.STATIC_DRAW);
  var tl = gl.getAttribLocation(prog, "a_texCoord"); gl.enableVertexAttribArray(tl); gl.vertexAttribPointer(tl, 2, gl.FLOAT, false, 0, 0);
  var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  var uMouse = gl.getUniformLocation(prog, "u_mouse"), uRadius = gl.getUniformLocation(prog, "u_radius"),
      uStrength = gl.getUniformLocation(prog, "u_strength"), uActive = gl.getUniformLocation(prog, "u_active"),
      uTime = gl.getUniformLocation(prog, "u_time");

  function resize() {
    canvas.width = video.videoWidth || canvas.clientWidth || section.clientWidth;
    canvas.height = video.videoHeight || canvas.clientHeight || section.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  video.addEventListener("loadedmetadata", resize);

  // mouse state (target tx/ty/tact) + exponentially-smoothed mx/my/act
  var mx = 0.5, my = 0.5, tx = 0.5, ty = 0.5, act = 0, tact = 0, last = performance.now(), live = false;
  section.addEventListener("mousemove", function (e) {
    var r = canvas.getBoundingClientRect(); if (!r.width) return;
    tx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    ty = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    tact = 1;
  });
  section.addEventListener("mouseleave", function () { tact = 0; });

  function frame() {
    var now = performance.now(), dt = (now - last) / 16.6667; last = now;
    var w = 1 - Math.pow(1 - P.smoothing, dt);
    mx += (tx - mx) * w; my += (ty - my) * w; act += (tact - act) * w;
    if (video.readyState >= 2 && video.videoWidth) {
      if (canvas.width !== video.videoWidth) resize();
      try {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.uniform2f(uMouse, mx, my); gl.uniform1f(uRadius, P.radius);
        gl.uniform1f(uStrength, P.strength); gl.uniform1f(uActive, act); gl.uniform1f(uTime, now / 1000);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!live) { live = true; section.classList.add("gl-ok"); } // canvas now owns the visual
      } catch (e) {}
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
