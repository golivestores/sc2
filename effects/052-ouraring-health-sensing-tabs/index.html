<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oura - Everyday health sensing</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --canvas:rgb(243,241,240); --ink:#19191c; --cream:#f7f1e8;
    --line:rgb(204,202,199);
    --sans:"Akkurat","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --serif:"Editorial New","Times New Roman",Georgia,serif;
  }
  html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:clamp(28px,6vw,80px) 0;overflow-x:hidden}
  /* content grid capped at 1440 (matches original col-main), 64px gutters */
  .wrap{max-width:1568px;margin:0 auto;padding:0 clamp(20px,4.45vw,64px)}

  /* heading: original 98px / lh 1.1 / weight 400 / ls normal / mb 64 */
  h2.title{
    font-family:var(--serif);font-weight:400;line-height:1.1;
    font-size:clamp(40px,6.81vw,98px);letter-spacing:normal;
    color:var(--ink);margin-bottom:64px;
  }

  /* tabs: single nowrap row, horizontally scrollable, centered via mx-auto; mb 80 */
  .tabs{
    display:flex;flex-wrap:nowrap;gap:12px;margin:0 auto 80px;
    width:fit-content;max-width:100%;overflow-x:auto;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto;
    border:2px solid var(--line);background:transparent;color:var(--ink);
    border-radius:100px;padding:16px 24px;font-size:18px;font-weight:700;
    line-height:1;white-space:nowrap;font-family:var(--sans);
    transition:background .2s,color .2s,border-color .2s;
  }
  .tab svg{width:22px;height:22px;flex:0 0 auto}
  .tab:hover{background:rgba(25,25,28,.06)}
  .tab.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .tab.active:hover{background:#000}

  /* carousel */
  .rail{
    display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-behavior:smooth;cursor:grab;list-style:none;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail.dragging{cursor:grabbing;scroll-behavior:auto}
  .rail.dragging *{pointer-events:none}

  .card{flex:0 0 auto;width:300px;scroll-snap-align:start;list-style:none}
  @media(max-width:640px){.card{width:270px}}

  /* featured lifestyle card: image 300x418 rounded 24, centered white category icon 62px */
  .feat-img{position:relative;height:418px;border-radius:24px;overflow:hidden}
  .feat-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .feat-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
  .feat-icon svg{width:62px;height:62px}

  /* feature card: square dark-gradient fig (radius 24, mb 24) + 18/700 title + 14 desc */
  .fig{
    position:relative;aspect-ratio:1/1;border-radius:24px;overflow:hidden;margin-bottom:24px;
    background-image:url("assets/pop_membership_card_bg_gray.png");
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;
  }
  .fig img{width:100%;height:100%;object-fit:contain;padding:24px;display:block}
  .card h3{font-size:18px;font-weight:700;line-height:1.5;margin:0 0 12px;color:var(--ink)}
  .card p{font-size:14px;line-height:1.5;color:var(--ink);font-weight:400}

  /* controls: 240px pill, 40x40 borderless chevrons, 1px track, scaleX grow bar */
  .controls{display:flex;justify-content:center;margin-top:88px}
  .ctl-pill{display:flex;align-items:center;gap:4px;width:240px;background:rgba(203,198,190,.45);border-radius:100px;padding:8px 16px}
  .arrow{
    width:40px;height:40px;border:none;background:none;color:var(--ink);padding:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
    transition:opacity .18s;
  }
  .arrow:disabled{opacity:.3;cursor:default}
  .arrow svg{width:15px;height:15px}
  .track{position:relative;flex:1;height:1px;background:rgb(211,209,206);overflow:hidden}
  .thumb{position:absolute;inset:0;height:1px;background:rgb(74,71,65);transform-origin:left;transform:scaleX(0)}
</style>
</head>
<body>
  <div class="wrap">
    <h2 class="title" id="heading"></h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <ul class="rail" id="rail" aria-label="Health sensing features"></ul>
    <div class="controls">
      <div class="ctl-pill">
        <button class="arrow" id="prev" aria-label="go to previous slide">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 4.5l-7.5 7.5 7.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="track"><div class="thumb" id="thumb"></div></div>
        <button class="arrow" id="next" aria-label="go to next slide">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 4.5l7.5 7.5-7.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

function buildTabs(){
  DATA.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===0?' active':'');
    b.setAttribute('role','tab');
    b.innerHTML=t.icon+'<span>'+t.label+'</span>';
    b.addEventListener('click',()=>select(i));
    tabsEl.appendChild(b);
  });
}
function renderCards(i){
  const t=DATA[i];
  let h='<li class="card featured"><div class="feat-img"><img src="assets/'+t.featured.img+'" alt="'+esc(t.featured.alt)+'" draggable="false"><span class="feat-icon">'+t.icon+'</span></div></li>';
  t.cards.forEach(c=>{
    h+='<li class="card"><div class="fig"><img src="assets/'+c.img+'" alt="'+esc(c.title)+'" draggable="false"></div>'+
       '<h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p></li>';
  });
  railEl.innerHTML=h;
}
function select(i){
  active=i;
  [...tabsEl.children].forEach((b,k)=>b.classList.toggle('active',k===i));
  renderCards(i);
  railEl.scrollLeft=0;
  requestAnimationFrame(updateUI);
}
function step(){
  const c=railEl.querySelector('.card');
  const gap=parseFloat(getComputedStyle(railEl).gap)||24;
  return (c?c.getBoundingClientRect().width:300)+gap;
}
function updateUI(){
  const max=railEl.scrollWidth-railEl.clientWidth;
  const p=max>0?Math.min(1,Math.max(0,railEl.scrollLeft/max)):0;
  thumb.style.transform='scaleX('+p+')';
  prevBtn.disabled=railEl.scrollLeft<=2;
  nextBtn.disabled=railEl.scrollLeft>=max-2;
}
prevBtn.addEventListener('click',()=>railEl.scrollBy({left:-step(),behavior:'smooth'}));
nextBtn.addEventListener('click',()=>railEl.scrollBy({left:step(),behavior:'smooth'}));
railEl.addEventListener('scroll',()=>requestAnimationFrame(updateUI),{passive:true});
window.addEventListener('resize',updateUI);

let down=false,sx=0,sl=0,moved=0;
railEl.addEventListener('pointerdown',e=>{down=true;moved=0;sx=e.clientX;sl=railEl.scrollLeft;railEl.classList.add('dragging');railEl.setPointerCapture(e.pointerId);});
railEl.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));railEl.scrollLeft=sl-dx;});
function endDrag(e){if(!down)return;down=false;railEl.classList.remove('dragging');try{railEl.releasePointerCapture(e.pointerId)}catch(_){}}
railEl.addEventListener('pointerup',endDrag);
railEl.addEventListener('pointercancel',endDrag);
railEl.addEventListener('click',e=>{if(moved>6){e.preventDefault();e.stopPropagation();}},true);

buildTabs();
select(0);
window.addEventListener('load',()=>requestAnimationFrame(updateUI));
</script>
