<!doctype html>
<!--
  sc2 effect template — self-contained with GSAP ScrollTrigger.
  ============================================================
  使用方法：
    1. cp -r gsap/templates/effect-with-gsap.html effects/NNN-name/index.html
    2. mkdir effects/NNN-name/lib
    3. cp gsap/dist/gsap.min.js gsap/dist/ScrollTrigger.min.js effects/NNN-name/lib/
       （需要其它插件就一起 cp，比如 SplitText.min.js Flip.min.js）
    4. 改 <title>、改 .demo 内容、改 <script> 里的动画逻辑
    5. 写 meta.json（tech 字段标 "GSAP + ScrollTrigger"）
    6. python rebuild-index.py → 卡片自动出现
    7. python inject-overlay.py → 加 zip + 源码 浮层
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effect Name — sc2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0e0e10; color: #f5f5f0; font-family: -apple-system, "Segoe UI", sans-serif; }

  /* ====== 你的样式从这里开始 ====== */
  .demo {
    min-height: 100vh;
    padding: 12vh 8vw;
  }
  .demo h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 1.05;
    margin-bottom: 8vh;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .card {
    aspect-ratio: 4/5;
    background: linear-gradient(135deg, #2a2a30, #1a1a1f);
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 24px;
    font-size: 20px;
    font-weight: 600;
  }
  /* ====== 你的样式到这里结束 ====== */
</style>
</head>
<body>

<!-- ====== 你的 DOM 从这里开始 ====== -->
<section class="demo">
  <h1>Effect Title<br>goes here</h1>
  <div class="grid">
    <div class="card">Card 01</div>
    <div class="card">Card 02</div>
    <div class="card">Card 03</div>
    <div class="card">Card 04</div>
    <div class="card">Card 05</div>
    <div class="card">Card 06</div>
  </div>
</section>
<!-- ====== 你的 DOM 到这里结束 ====== -->

<!-- GSAP 核心 + ScrollTrigger（按需加更多插件） -->
<script src="lib/gsap.min.js"></script>
<script src="lib/ScrollTrigger.min.js"></script>

<script>
(function () {
  // sc2 ?demo=preview 约定：卡片缩略图模式下跳过 ScrollTrigger，直接播到末态
  const isPreview = new URLSearchParams(location.search).get('demo') === 'preview';

  if (isPreview) {
    // 缩略图模式：把动画末态直接设上去，让卡片预览有内容
    gsap.set('.card, h1', { opacity: 1, y: 0 });
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  // 标题入场
  gsap.from('h1', {
    opacity: 0,
    y: 80,
    duration: 1,
    ease: 'power3.out'
  });

  // 卡片 per-element cascade reveal
  gsap.utils.toArray('.card').forEach((card, i) => {
    gsap.from(card, {
      opacity: 0,
      y: 60,
      duration: 0.8,
      ease: 'power2.out',
      delay: i * 0.05,
      scrollTrigger: {
        trigger: card,
        start: 'top 85%',
        toggleActions: 'play none none reverse'
      }
    });
  });
})();
</script>

</body>
</html>
